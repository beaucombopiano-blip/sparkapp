name: spark
description: "SPARK: By Teens. For Teens. AI-powered passion project planning."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.0.2

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  collection: ^1.19.1

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  firebase_app_check: ^0.4.8
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0

  # Sign-in
  sign_in_with_apple: ^8.2.0
  google_sign_in: ^7.2.0
  app_links: ^7.2.2
  crypto: ^3.0.7

  # Streaming AI
  http: ^1.6.0

  # Calendar
  table_calendar: ^3.3.0

  # Local notifications
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # Billing and ads
  purchases_flutter: ^10.15.2
  google_mobile_ads: ^9.1.0

  # Media
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  flutter_image_compress: ^2.5.1
  pdfx: ^2.11.0

  # Animation
  flutter_animate: ^4.5.2
  lottie: ^3.6.1

  # Fonts and misc
  google_fonts: ^9.0.0
  url_launcher: ^6.3.3
  intl: ^0.20.2
  shimmer: ^4.0.0
  connectivity_plus: ^7.3.2
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  flutter_markdown_plus: ^1.0.12
  flex_color_picker: ^4.0.0
  material_ui: ^1.6.0
  cupertino_ui: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.3.0
  image_picker_platform_interface: ^2.11.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/characters/
    - assets/celebrations/
    - assets/seasonal/
    - assets/google_fonts/
